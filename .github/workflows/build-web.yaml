name: Qt WebAssembly Build & Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.50"
          actions-cache-folder: "emsdk-cache"

      - name: Install Qt Desktop (Host Tools)
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.7.2"
          host: "linux"
          target: "desktop"

      - name: Install Qt WASM
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.7.2"
          host: "linux"
          target: "desktop"
          arch: "wasm_singlethread"

      - name: Build Project
        run: |
          mkdir build
          cd build
          qt-cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel
          mv Pathfinder.html index.html

      - name: Deploy to Web Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dev/web
          publish_dir: ./build/
          force_orphan: true
