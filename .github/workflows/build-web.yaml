name: Qt WebAssembly Build & Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.37"
          actions-cache-folder: "emsdk-cache"

      - name: Install Qt Desktop (Host Tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          host: "linux"
          target: "desktop"
          dir: "${{ github.workspace }}/qt-host"
          set-env: false

      - name: Install Qt WASM
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          host: "linux"
          target: "desktop"
          arch: "wasm_singlethread"
          dir: "${{ github.workspace }}/qt-wasm"
          set-env: true

      - name: Find Qt paths (Debug)
        run: |
          echo "=== qt-cmake ===" && find ${{ github.workspace }}/qt-wasm -name "qt-cmake" 2>/dev/null
          echo "=== qmake ===" && find ${{ github.workspace }}/qt-host -name "qmake" 2>/dev/null
          echo "PATH=$PATH"
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
      
      - name: Fix Qt permissions
        run: |
          chmod -R +x ${{ github.workspace }}/qt-wasm/Qt/6.6.3/wasm_singlethread/bin/
          chmod -R +x ${{ github.workspace }}/qt-host/Qt/6.6.3/gcc_64/bin/

      - name: Build Project
        env:
          QT_HOST_PATH: ${{ github.workspace }}/qt-host/Qt/6.6.3/gcc_64
        run: |
          mkdir build && cd build
          qt-cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH=${QT_HOST_PATH}
          cmake --build . --parallel
          [ -f Pathfinder.html ] && mv Pathfinder.html index.html

      - name: Deploy to Web Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dev/web
          publish_dir: ./build/
          force_orphan: true